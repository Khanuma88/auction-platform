spring:
  application:
    name: auction-platform

  datasource:
    # Defaults match compose.yaml; on the hosting platform they come from environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5434/auction}
    username: ${DB_USER:auction}
    password: ${DB_PASSWORD:auction}
    hikari:
      # Small pool on purpose: free managed Postgres tiers allow few connections.
      # Justification will go into an ADR (LO3).
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 10000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. No auto-generated schema.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
